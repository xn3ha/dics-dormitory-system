{% extends "base.html" %}{% block title %}Reports{% endblock %}{% block body %}<h1>Reports</h1>
{% for k,v in reports.items() %}<div class="card row"><b style="flex:1">{{ v[0] }}</b>
<a class="btn sec sm" href="{{ url_for('report',kind=k) }}">View</a><a class="btn sm" href="{{ url_for('report',kind=k,format='csv') }}">Download CSV</a></div>{% endfor %}{% endblock %}
