{% extends "base.html" %}{% block title %}Resident{% endblock %}{% block body %}<h1>{{ 'Edit' if res else 'Add' }} resident</h1>
<div class="card" style="max-width:440px"><form method="post">{{ tok }}
<label>Full name</label><input name="name" value="{{ res.name if res }}" required>
<label>Email</label><input name="email" type="email" value="{{ res.email if res }}" required>
<label>Phone</label><input name="phone" value="{{ res.phone if res }}">
<label>Status</label><select name="status">{% for s in ['approved','pending','rejected'] %}<option {{ 'selected' if res and res.registrationStatus==s }}>{{ s }}</option>{% endfor %}</select>
<label>{{ 'New password (leave blank to keep)' if res else 'Password (min 6)' }}</label><input name="password" type="password" {{ '' if res else 'required minlength=6' }}>
<p><button class="btn">Save</button> <a href="{{ url_for('residents') }}">Cancel</a></p></form></div>{% endblock %}
